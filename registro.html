<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro | BusUCR</title>

    <link
        rel="stylesheet"
        href="css/styleRegistro.css"
    >

</head>


<body class="registro-page">

    <main class="registro-container">

        <div class="registro-card">

            <div class="registro-logo">
                🚌
            </div>

            <h1>
                Crear cuenta
            </h1>

            <p class="registro-subtitle">
                Regístrate en BusUCR
            </p>


            <form>


                <div class="registro-group">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ej. Jarod Delgado"
                        required
                    >

                </div>


                <div class="registro-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                </div>


                <div class="registro-group">

                    <label for="carnet">
                        Carné universitario
                    </label>

                    <input
                        type="text"
                        id="carnet"
                        name="carnet"
                        placeholder="Ingrese su carné"
                        required
                    >

                </div>


                <div class="registro-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingrese una contraseña"
                        required
                    >

                </div>


                <div class="registro-group">

                    <label for="confirmar">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar"
                        name="confirmar"
                        placeholder="Repita su contraseña"
                        required
                    >

                </div>


                <div class="registro-terminos">

                    <input
                        type="checkbox"
                        id="terminos"
                        required
                    >

                    <label for="terminos">
                        Acepto los términos y condiciones
                    </label>

                </div>


                <button
                    type="submit"
                    class="btn-registro"
                >
                    Crear cuenta
                </button>

            </form>


            <p class="registro-login">

                ¿Ya tienes una cuenta?

                <a href="login.html">
                    Iniciar sesión
                </a>

            </p>


            <a
                href="index.html"
                class="volver"
            >
                ← Volver al inicio
            </a>

        </div>

    </main>

</body>

</html>
