<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | BusUCR</title>

    <!-- CSS del registro -->
    <link rel="stylesheet" href="css/styleRegistro.css">

</head>


<body class="registro-page">

    <main class="registro-container">

        <div class="registro-card">


            <!-- ==============================
                 LOGO
            =============================== -->

            <div class="registro-logo">
                🚌
            </div>


            <!-- ==============================
                 ENCABEZADO
            =============================== -->

            <h1>
                Crear cuenta
            </h1>

            <p class="registro-subtitle">
                Regístrate en BusUCR
            </p>


            <!-- ==============================
                 FORMULARIO
            =============================== -->

            <form id="registroForm">


                <!-- NOMBRE -->

                <div class="registro-group">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Jarod Delgado" required>

                </div>


                <!-- CORREO -->

                <div class="registro-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

                </div>


                <!-- CARNÉ -->

                <div class="registro-group">

                    <label for="carnet">
                        Carné universitario
                    </label>

                    <input type="text" id="carnet" name="carnet" placeholder="Ingrese su carné" required>

                </div>

                <!-- TÉRMINOS -->

                <div class="registro-terminos">

                    <input type="checkbox" id="terminos" name="terminos" required>

                    <label for="terminos">
                        Acepto los términos y condiciones
                    </label>

                </div>


                <!-- MENSAJE DE ERROR / ÉXITO -->

                <div id="mensaje" class="mensaje"></div>


                <!-- BOTÓN -->

                <button type="submit" id="btnRegistro" class="btn-registro">
                    Crear cuenta
                </button>


            </form>


            <!-- ==============================
                 LOGIN
            =============================== -->

            <p class="registro-login">

                ¿Ya tienes una cuenta?

                <a href="login.html">
                    Iniciar sesión
                </a>

            </p>


            <!-- ==============================
                 VOLVER
            =============================== -->

            <a href="index.html" class="volver">
                ← Volver al inicio
            </a>


        </div>

    </main>


    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script src="js/email.js"></script>
    
    <script src="js/registro.js"></script>

</body>

</html>
